# Overlay on docker-compose.dev.yml for native-btop acceptance.
# Reuse the existing dev frontend and BFF; only btop uses the isolated broker.
# Found Footy keeps its workspace broker; all production services are unchanged.
services:
  api:
    environment:
      # Qualify the network because both brokers advertise the alias "nats".
      NATS_URL: nats://nats.luv-dev:4222
      BTOP_NATS_URL: nats://control-telemetry-socket-test-nats-1:4222
    networks: [btop-acceptance]
networks:
  btop-acceptance:
    name: control-telemetry-socket-test_broker
    external: true
