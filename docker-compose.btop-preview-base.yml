# Shared preview runtime for isolated automation and private phone acceptance.
services:
  preview:
    image: node:18-alpine@sha256:8d6421d663b4c28fd3ebc498332f249011d118945588d0a35cb9bc4b8ca09d9e
    user: "1000:1000"
    working_dir: /app
    command: [node, --import, tsx, tests/btop-browser/server.ts]
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      NATS_URL: nats://nats:4222
    volumes:
      - .:/app:ro
    networks: [broker]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/__acceptance/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
