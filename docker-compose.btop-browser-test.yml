# The broker network belongs only to Control's disposable socket-test stack.
name: vedanta-systems-btop-browser-test
services:
  preview:
    image: node:18-alpine@sha256:8d6421d663b4c28fd3ebc498332f249011d118945588d0a35cb9bc4b8ca09d9e
    user: "1000:1000"
    working_dir: /app
    command: [node, --import, tsx, tests/btop-browser/server.ts]
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      NATS_URL: nats://nats:4222
    volumes:
      - .:/app:ro
    networks: [broker]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/__acceptance/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
  browsers:
    image: vedanta-systems-btop-browser-tests:20260910
    user: "1000:1000"
    init: true
    working_dir: /app
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      BTOP_PREVIEW_URL: http://preview:3000/tests/btop-browser/index.html
    volumes:
      - .:/app:ro
      - type: bind
        source: ${BTOP_BROWSER_ARTIFACTS:?select a private test-artifact directory}
        target: /artifacts
        bind: {create_host_path: false}
    networks: [broker]
    depends_on:
      preview: {condition: service_healthy}
networks:
  broker:
    name: control-telemetry-socket-test_broker
    external: true
