# The broker network belongs only to Control's disposable socket-test stack.
name: vedanta-systems-btop-browser-test
services:
  preview:
    extends:
      file: docker-compose.btop-preview-base.yml
      service: preview
  browsers:
    image: vedanta-systems-btop-browser-tests:20260910
    user: "1000:1000"
    init: true
    working_dir: /app
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      BTOP_PREVIEW_URL: http://preview:3000/tests/btop-browser/index.html
    volumes:
      - .:/app:ro
      - type: bind
        source: ${BTOP_BROWSER_ARTIFACTS:?select a private test-artifact directory}
        target: /artifacts
        bind: {create_host_path: false}
    networks: [broker]
    depends_on:
      preview: {condition: service_healthy}
networks:
  broker:
    name: control-telemetry-socket-test_broker
    external: true
