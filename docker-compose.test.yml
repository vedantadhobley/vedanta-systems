# Ephemeral integration tests: 832 MiB total cap, no host ports or durable data.
name: vedanta-systems-test
services:
  nats:
    image: nats:2.10-alpine
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
  tests:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      NATS_TEST_URL: nats://nats:4222
    command: npm run test:found-footy
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    depends_on:
      - nats
networks:
  default:
    internal: true
