name: vedanta-systems-prod

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_FOOTY_API_URL=https://vedanta.systems/api/found-footy
        - VITE_SPIN_CYCLE_API_URL=https://vedanta.systems/api/spin-cycle
    container_name: vedanta-systems-prod
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - /home/vedanta/photos:/app/dist/photos:ro
    networks:
      - vedanta-systems-prod
      - proxy
    depends_on:
      - api

  # API serverndles all project APIs (/api/found-footy/*, /api/legal-tender/*, etc.)
  api:
    container_name: vedanta-systems-prod-api
    build:
      context: .
      dockerfile: Dockerfile.api
    # No ports exposed - only accessible via nginx proxy on internal network
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - API_PORT=3001
      # Server-only GitHub credential for the cached contribution calendar.
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Found Footy — Pattern B: proxy the Go read API and preserve its public
      # presentation contract. Replaces the old direct Mongo/MinIO reads.
      - FOUND_FOOTY_API_URL=http://found-footy-prod-api:8081
      # Live-feed bridge: NODE_ENV=production scopes the subscription to found-footy.prod.>
      # on the shared workspace NATS, fanned to SSE.
      - NATS_URL=nats://nats:4222
      - BTOP_NODES=luv,joi
      # Spin Cycle PostgreSQL - connects to spin-cycle-prod-postgres on luv-prod network
      - SPIN_CYCLE_POSTGRES_URI=postgresql://${SPIN_CYCLE_POSTGRES_USER}:${SPIN_CYCLE_POSTGRES_PASS}@spin-cycle-prod-postgres:5432/spincycle
      # Long Exposure PostgreSQL (TimescaleDB; narratives) - long-exposure-prod-postgres on luv-prod
      - LONG_EXPOSURE_POSTGRES_URI=postgresql://${LONG_EXPOSURE_POSTGRES_USER:?set LONG_EXPOSURE_POSTGRES_USER in .env}:${LONG_EXPOSURE_POSTGRES_PASS:?set LONG_EXPOSURE_POSTGRES_PASS in .env}@long-exposure-prod-postgres:5432/longexposure
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    networks:
      - vedanta-systems-prod
      - luv-prod

networks:
  vedanta-systems-prod:
    name: vedanta-systems-prod
    driver: bridge
  luv-prod:
    name: luv-prod
    external: true

  # Caddy reverse proxy fronts HTTP services here.
  # Cloudflared (in ~/workspace/proxy/) routes vedanta.systems traffic
  # to caddy on this network.
  proxy:
    name: proxy
    external: true
