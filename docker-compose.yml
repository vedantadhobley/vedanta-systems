name: vedanta-systems-prod

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_FOOTY_API_URL=https://vedanta.systems/api/found-footy
        - VITE_SPIN_CYCLE_API_URL=https://vedanta.systems/api/spin-cycle
    container_name: vedanta-systems-prod
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - /home/vedanta/photos:/app/dist/photos:ro
    networks:
      - vedanta-systems-prod
      - proxy
    depends_on:
      - api

  # API serverndles all project APIs (/api/found-footy/*, /api/legal-tender/*, etc.)
  api:
    container_name: vedanta-systems-prod-api
    build:
      context: .
      dockerfile: Dockerfile.api
    # No ports exposed - only accessible via nginx proxy on internal network
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - API_PORT=3001
      # Server-only GitHub credential for the cached contribution calendar.
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Found Footy — Pattern B: proxy the Go read API (reshaped to the legacy frontend shape
      # in src/server/routes/found-footy.ts). Replaces the old direct Mongo/MinIO reads.
      - FOUND_FOOTY_API_URL=http://found-footy-prod-api:8081
      # Live-feed bridge: NODE_ENV=production scopes the subscription to found-footy.prod.>
      # on the shared workspace NATS, fanned to SSE.
      - NATS_URL=nats://nats:4222
      - BTOP_NODES=luv,joi
      # Spin Cycle PostgreSQL - connects to spin-cycle-prod-postgres on luv-prod network
      - SPIN_CYCLE_POSTGRES_URI=postgresql://${SPIN_CYCLE_POSTGRES_USER}:${SPIN_CYCLE_POSTGRES_PASS}@spin-cycle-prod-postgres:5432/spincycle
      # Long Exposure PostgreSQL (TimescaleDB; narratives) - long-exposure-prod-postgres on luv-prod
      - LONG_EXPOSURE_POSTGRES_URI=postgresql://${LONG_EXPOSURE_POSTGRES_USER:?set LONG_EXPOSURE_POSTGRES_USER in .env}:${LONG_EXPOSURE_POSTGRES_PASS:?set LONG_EXPOSURE_POSTGRES_PASS in .env}@long-exposure-prod-postgres:5432/longexposure
      # btop runs with network_mode:host, so reach it via host gateway
      - BTOP_HOST=host-gateway
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    networks:
      - vedanta-systems-prod
      - luv-prod

  # btop system monitor - luv node (local)
  btop-luv:
    container_name: vedanta-systems-prod-btop-luv
    hostname: luv
    build:
      context: ./btop
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    
    # Required for FULL host system visibility
    pid: host                    # See host processes
    network_mode: host           # See host network traffic (required for accurate net stats)
    privileged: true             # Required for GPU access and full /proc visibility
    
    volumes:
      # Host system info - mounted at original paths so btop works unchanged
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /:/hostfs:ro                    # Host root filesystem for disk stats
      - /run/media:/run/media:ro        # Mounted drives (if any)
      
      # GPU access for AMD ROCm
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    environment:
      - WRAPPER_PORT=3102        # Prod: 3102, Dev: 4102 (binds to host with network_mode: host)
      - BTOP_HOST=local          # "local" or "user@host" for SSH to remote
      - TZ=UTC
    
    # No ports needed - network_mode: host means it binds directly to host ports
    
    # Ensure GPU is accessible
    devices:
      - /dev/dri:/dev/dri
    
    # AMD GPU specific - use GIDs since groups don't exist in container
    group_add:
      - "44"   # video
      - "992"  # render
    
    # Note: No networks needed with network_mode: host

networks:
  vedanta-systems-prod:
    name: vedanta-systems-prod
    driver: bridge
  luv-prod:
    name: luv-prod
    external: true

  # Caddy reverse proxy fronts HTTP services here.
  # Cloudflared (in ~/workspace/proxy/) routes vedanta.systems traffic
  # to caddy on this network.
  proxy:
    name: proxy
    external: true
