# Requires the NATS auth test stack and Control private exporter test stack.
# Source/dependency mounts are read-only. Never attaches to a live network.
name: vedanta-systems-nats-test
services:
  tests:
    image: node:18-alpine
    user: "1000:1000"
    working_dir: /app
    command: [node, --import, tsx, --test, src/server/nats-auth.test.ts, src/server/btop-auth.integration.test.ts, src/server/routes/found-footy.test.ts]
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      NATS_TEST_URL: nats://broker:4222
      BTOP_AUTH_TEST_URL: nats://broker:4222
      NATS_TEST_PUBLISHER_CREDS: /state/creds/found-footy-dev-worker.creds
      NATS_TEST_CONSUMER_CREDS: /state/creds/vedanta-systems-dev-consumer.creds
    volumes:
      - .:/app:ro
      - auth:/state:ro
    networks: [broker]
networks:
  broker:
    name: nats-auth-test_default
    external: true
volumes:
  auth:
    name: nats-auth-test_state
    external: true
